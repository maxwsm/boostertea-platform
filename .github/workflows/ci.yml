name: WSM Ecosystem CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: TypeScript Strict Check
      run: bun run tsc --noEmit
      
    - name: Security Audit (Bun)
      run: bun pm trust
      
    - name: Lint Ecosystem
      run: bun run lint
      
    - name: Build Next.js & Hono Nodes
      run: bun run build
