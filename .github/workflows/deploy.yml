name: Titan ERP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest
    if: false # TODO: Ввімкнути коли буде SSH або Runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Тут ми можемо додати Action, який логіниться по SSH на 5.189.141.134 
      # і робить git pull && npx prisma db push.
      # Поки сервер не пускає по SSH, Github Action просто збирає проект як "Dry Run".
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Build Turbo
        run: npx turbo run build --filter=wsm-dashboard...

  deploy-to-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=\${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        run: vercel build --prod --token=\${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=\${{ secrets.VERCEL_TOKEN }}
