version: '3.8'

services:
  boostertea-web:
    image: node:22
    container_name: wsm-boostertea
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    ports:
      - "3010:3000"
    command: sh -c "corepack enable pnpm && cd apps/boostertea-web && pnpm run build && pnpm run start"
    volumes:
      - .:/app
      - wsm_db_volume:/app/packages/wsm-db/prisma
    restart: unless-stopped

  wsm-dashboard:
    image: node:22
    container_name: wsm-dashboard
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    ports:
      - "3000:3000"
    command: sh -c "corepack enable pnpm && cd apps/wsm-dashboard && pnpm run build && pnpm run start"
    volumes:
      - .:/app
    restart: unless-stopped

  dinoslush-web:
    image: node:22
    container_name: wsm-dinoslush
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    ports:
      - "3004:3004"
    command: sh -c "corepack enable pnpm && cd apps/dinoslush-web && pnpm run build && pnpm run start"
    volumes:
      - .:/app
    restart: unless-stopped

  funnydrops-web:
    image: node:22
    container_name: wsm-funnydrops
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    ports:
      - "3005:3005"
    command: sh -c "corepack enable pnpm && cd apps/funnydrops-web && pnpm run build && pnpm run start"
    volumes:
      - .:/app
    restart: unless-stopped

  tlab-web:
    image: node:22
    container_name: wsm-tlab
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    ports:
      - "3006:3006"
    command: sh -c "corepack enable pnpm && cd apps/tlab-web && pnpm run build && pnpm run start"
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: wsm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wsm_admin
      POSTGRES_PASSWORD: wsm_password
      POSTGRES_DB: wsm_omniverse
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wsm-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  wsm_db_volume:
    name: wsm_db_persistent_storage
  pgdata:
    name: wsm_pgdata
